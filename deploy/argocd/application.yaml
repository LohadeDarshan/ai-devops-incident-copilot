apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: incident-copilot
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/LohadeDarshan/ai-devops-incident-copilot.git
    targetRevision: main
    path: deploy/base

  destination:
    server: https://kubernetes.default.svc
    namespace: incident-copilot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true