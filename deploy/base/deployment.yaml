apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-copilot
  namespace: incident-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-copilot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: incident-copilot
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown 10001:999 /data
              if [ -f /data/incidents.jsonl ]; then
                chown 10001:999 /data/incidents.jsonl
                chmod 664 /data/incidents.jsonl
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: incident-data
              mountPath: /data
      containers:
        - name: copilot
          image: myserverd/ai-devops-incident-copilot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROM_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: OLLAMA_URL
              value: "http://192.168.160.10:11434"
            - name: MODEL
              value: "qwen2.5:0.5b"
            - name: INCIDENT_FILE
              value: "/data/incidents.jsonl"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: incident-data
              mountPath: /data
      volumes:
        - name: incident-data
          persistentVolumeClaim:
            claimName: incident-copilot-data
