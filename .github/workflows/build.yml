name: Build and Publish Copilot

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/base/deployment.yaml"

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Update GitOps deployment manifest
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s|image: .*|image: ${IMAGE}:${TAG}|" \
            deploy/base/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/base/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): deploy ${TAG}"
            git push
          fi